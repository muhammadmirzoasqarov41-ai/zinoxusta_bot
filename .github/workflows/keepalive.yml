name: Keep Render Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: https://ustaqidir-bot.onrender.com/health
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 \
            "$HEALTH_URL"
